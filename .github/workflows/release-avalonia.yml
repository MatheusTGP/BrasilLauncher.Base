name: Release Avalonia

on:
  push:
    tags:
      - "v*-avalonia"

permissions:
  contents: write

env:
  DOTNET_VERSION: 9.0.x

jobs:

  publish:

    strategy:
      fail-fast: false

      matrix:
        include:

          - os: windows-latest
            runtime: win-x64

          - os: windows-latest
            runtime: win-x86

          - os: windows-latest
            runtime: win-arm64

          - os: ubuntu-latest
            runtime: linux-x64

          - os: ubuntu-latest
            runtime: linux-arm64

          - os: macos-latest
            runtime: osx-x64

          - os: macos-latest
            runtime: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore BrasilLauncher.Avalonia/BrasilLauncher.csproj

      - name: Publish
        run: |
          dotnet publish BrasilLauncher.Avalonia/BrasilLauncher.csproj \
          -c Release \
          -r ${{ matrix.runtime }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -o publish
        shell: bash

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
          -Path publish/* `
          -DestinationPath BrasilLauncher-Avalonia-${{ matrix.runtime }}.zip

      - name: Tar (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf BrasilLauncher-Avalonia-${{ matrix.runtime }}.tar.gz -C publish .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}
          path: |
            *.zip
            *.tar.gz

  release:

    needs: publish

    runs-on: ubuntu-latest

    steps:

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz