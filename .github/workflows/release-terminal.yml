name: Release Terminal

on:
  push:
    tags:
      - "v*-terminal"

permissions:
  contents: write

env:
  DOTNET_VERSION: 9.0.x

jobs:

  publish:

    strategy:
      fail-fast: false

      matrix:
        include:

          - os: windows-latest
            runtime: win-x64

          - os: windows-latest
            runtime: win-x86

          - os: windows-latest
            runtime: win-arm64

    runs-on: ${{ matrix.os }}

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore BrasilLauncher.Terminal/BrasilLauncher.csproj

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish BrasilLauncher.Terminal/BrasilLauncher.csproj `
          -c Release `
          -r ${{ matrix.runtime }} `
          --self-contained true `
          -p:PublishSingleFile=true `
          -o publish

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive `
          -Path publish/* `
          -DestinationPath BrasilLauncher-Terminal-${{ matrix.runtime }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}
          path: |
            *.zip

  release:

    needs: publish

    runs-on: ubuntu-latest

    steps:

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.zip